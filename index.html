<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathVibe Example Gallery</title>
  <meta name="description" content="Published example lessons from the MathVibe user studies and illustrative examples of the system's capabilities." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-bar">
      <a class="brand" href="./">
        <img src="logo.svg" alt="Explorable Explanation AI Logo" />
        <span class="brand-label">Example Gallery</span>
      </a>
      <nav class="header-nav">
        <a href="https://gallery.mathvibe.space/" target="_blank" rel="noopener">Explorables Gallery ↗</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>MathVibe Example Gallery</h1>
      <p class="subtitle">
        Published lessons from the user studies, plus examples created to
        illustrate the capabilities of the system. Click any card to open the
        full interactive lesson.
      </p>
      <nav class="filters" id="filters" aria-label="Filter by condition"></nav>
    </div>
  </section>

  <main class="container" id="gallery"></main>

  <footer class="site-footer">
    <div class="container footer-bar">
      <a class="brand" href="./">
        <img src="logo.svg" alt="Explorable Explanation AI Logo" />
      </a>
      <p>MathVibe — Explorable Explanations for Mathematics</p>
    </div>
  </footer>

  <script src="examples.js"></script>
  <script src="app.js"></script>
</body>
</html>
